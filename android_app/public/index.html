<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPro | Intelligence Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        :root { --primary-bg: #0b0f19; --card-bg: #151c2c; --accent: #38bdf8; --border: #2d3748; --text-muted: #94a3b8; }
        body { background-color: var(--primary-bg); color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; }
        .navbar { background-color: var(--card-bg) !important; border-bottom: 1px solid var(--border); }
        .nav-pills .nav-link { color: var(--text-muted); font-weight: 600; border-radius: 8px; margin-right: 5px; }
        .nav-pills .nav-link.active { background-color: rgba(56, 189, 248, 0.1); color: var(--accent); border: 1px solid var(--accent); }
        .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 1rem; }
        .section-header { font-size: 0.8rem; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem; display: flex; align-items: center; }
        .section-header i { margin-right: 8px; }
        .news-impact-pos { color: #10b981; }
        .news-impact-neg { color: #ef4444; }
        .justification-box { background: rgba(56, 189, 248, 0.05); border-left: 3px solid var(--accent); padding: 10px; margin-top: 10px; font-size: 0.85rem; }
        .stock-symbol { font-size: 1.2rem; font-weight: 700; }
        #login-container { max-width: 400px; margin-top: 100px; }
        #dashboard-container { display: none; }
    </style>
</head>
<body>

<div id="login-container" class="container">
    <div class="card p-4 text-center">
        <h2 class="fw-bold mb-4"><i class="bi bi-cpu text-info"></i> STOCKPRO</h2>
        <input type="email" id="email" class="form-control bg-dark text-white border-secondary mb-3" placeholder="Email">
        <input type="password" id="password" class="form-control bg-dark text-white border-secondary mb-4" placeholder="Password">
        <button id="login-btn" class="btn btn-info w-100 fw-bold">AUTHENTICATE</button>
        <p id="login-error" class="text-danger mt-3 small" style="display:none;"></p>
    </div>
</div>

<div id="dashboard-container">
    <nav class="navbar navbar-dark px-3 py-2 sticky-top">
        <span class="navbar-brand fw-bold small"><i class="bi bi-lightning-charge-fill text-warning"></i> TERMINAL v4</span>
        <button id="logout-btn" class="btn btn-link text-muted p-0"><i class="bi bi-power"></i></button>
    </nav>

    <div class="container-fluid p-3">
        <ul class="nav nav-pills mb-4">
            <li class="nav-item flex-fill"><button class="nav-link active w-100" data-bs-toggle="pill" data-bs-target="#options">OPTIONS</button></li>
            <li class="nav-item flex-fill"><button class="nav-link w-100" data-bs-toggle="pill" data-bs-target="#intraday">INTRADAY</button></li>
            <li class="nav-item flex-fill"><button class="nav-link w-100" data-bs-toggle="pill" data-bs-target="#news">NEWS</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="options"><div id="option-content"></div></div>

            <div class="tab-pane fade" id="intraday">
                <div id="intraday-list"></div>
            </div>

            <div class="tab-pane fade" id="news">
                <div class="section-header"><i class="bi bi-newspaper"></i>Market Moving Headlines</div>
                <div id="news-list"></div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDMEUmFGSJBjGrz7fpDN46OiZlSJ6NTsjE",
        authDomain: "kunal-analysis.firebaseapp.com",
        projectId: "kunal-analysis",
        storageBucket: "kunal-analysis.firebasestorage.app",
        messagingSenderId: "328297105533",
        appId: "1:328297105533:web:3ed3d8d5aa3ec677b88914"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    document.getElementById('login-btn').onclick = async () => {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        try { await signInWithEmailAndPassword(auth, e, p); } catch(err) { document.getElementById('login-error').innerText = "Auth Failed"; document.getElementById('login-error').style.display='block'; }
    };
    document.getElementById('logout-btn').onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
        if (user) { document.getElementById('login-container').style.display = 'none'; document.getElementById('dashboard-container').style.display = 'block'; startApp(); }
        else { document.getElementById('login-container').style.display = 'block'; document.getElementById('dashboard-container').style.display = 'none'; }
    });

    function startApp() {
        onSnapshot(doc(db, "stock_scans", "intraday"), (snap) => {
            const data = snap.data();
            if (!data) return;

            // Render Stocks
            const stockCont = document.getElementById('intraday-list');
            stockCont.innerHTML = '';
            (data.results || []).forEach(s => {
                stockCont.innerHTML += `
                    <div class="card p-3">
                        <div class="d-flex justify-content-between">
                            <span class="stock-symbol">${s.symbol}</span>
                            <span class="text-${s.change > 0 ? 'success':'danger'} fw-bold">${s.change}%</span>
                        </div>
                        <div class="justification-box"><strong>WHY:</strong> ${s.justification}</div>
                        <div class="row mt-3 text-center small border-top border-secondary pt-2">
                            <div class="col">PRICE: ${s.price}</div>
                            <div class="col text-success">TGT: ${s.target}</div>
                            <div class="col text-danger">SL: ${s.stop}</div>
                        </div>
                    </div>`;
            });

            // Render News
            const newsCont = document.getElementById('news-list');
            newsCont.innerHTML = '';
            (data.market_news || []).forEach(n => {
                newsCont.innerHTML += `
                    <div class="card p-3">
                        <div class="small text-muted mb-1">${n.time} | Impact: <span class="news-impact-${n.impact.toLowerCase()}">${n.impact}</span></div>
                        <a href="${n.link}" target="_blank" class="text-white text-decoration-none fw-bold">${n.headline}</a>
                    </div>`;
            });
        });

        // Options logic stays the same (omitted for brevity but kept in file)
    }
</script>
</body>
</html>
