name: Cloud Hub Self-Healing Watchdog

on:
  schedule:
    # Runs every 30 minutes during market hours (03:30 to 10:30 UTC = 9:00 AM to 4:00 PM IST)
    - cron: '*/30 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  verify-and-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install firebase-admin requests

      - name: Run Healing Logic
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Uses built-in token to trigger its own repo
          REPO: ${{ github.repository }}
        run: |
          python -c "
          import firebase_admin
          from firebase_admin import credentials, firestore
          import json, os, requests, time
          from datetime import datetime

          # 1. Check if Market is actually open (Mon-Fri)
          if datetime.now().weekday() >= 5:
              print('Weekend. Watchdog Sleeping.')
              exit(0)

          # 2. Check Database Status
          cred_dict = json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT'])
          cred = credentials.Certificate(cred_dict)
          firebase_admin.initialize_app(cred)
          db = firestore.client()
          
          status_doc = db.collection('stock_scans').document('status').get().to_dict()
          status = status_doc.get('status', 'Idle')
          
          print(f'Current Status: {status}')

          # 3. Heal if Idle or Frozen during market hours
          if 'Live' not in status:
              print('System detected as IDLE. Triggering Auto-Heal...')
              url = f'https://api.github.com/repos/{os.environ[\"REPO\"]}/dispatches'
              headers = {'Authorization': f'Bearer {os.environ[\"GH_TOKEN\"]}', 'Accept': 'application/vnd.github+json'}
              r = requests.post(url, headers=headers, json={'event_type': 'manual_scan'})
              print(f'Heal Dispatch Sent: {r.status_code}')
          else:
              print('System is HEALTHY. No action needed.')
          "
