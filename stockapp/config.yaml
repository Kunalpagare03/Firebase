# Build Your Own Stock App (v4) - Configuration
# Swing, Positional and Long-Term Engine
capital: 1000000.0          # Total trading capital (Rs 10,00,000)
risk_per_trade: 0.01        # 1% risk per trade = Rs 10,000 max loss
initial_stop_pct: 0.08      # 8% stop loss below signal day close
max_entry_gap_pct: 0.03     # 3% maximum allowed gap-up at open

limits:
  max_open_trades: 10       # Maximum total open trades
  max_swing_trades: 4       # Up to 4 swing trades (5-day hold)
  max_positional_trades: 6  # Up to 6 positional trades (22-day hold)
  max_per_sector: 2         # Maximum concurrent trades in one sector
  max_new_per_night: 3      # Maximum new trades to open on any morning

exits:
  swing_max_days: 5         # Swing: close on day 5 OR first close > prev high
  positional_max_days: 22   # Positional: close on day 22
  trailing_stop_profit_trigger: 0.08 # +8% triggers trailing stop
  trailing_stop_step: 0.02  # Trail stop 2% below highest high once in profit

traffic_light:
  mode: "INFO"              # "INFO" (advisory) or "STRICT" (enforces sizing)
  vix_panic_threshold: 22.0 # India VIX >= 22 flags panic
  breadth_panic_threshold: 30.0 # Market breadth < 30% flags panic
  nifty_symbol: "^NSEI"
  vix_symbol: "^INDIAVIX"

scanner:
  min_price: 50.0           # Close >= Rs 50
  min_turnover_cr: 5.0      # 20-day avg daily turnover >= Rs 5 Crore
  results_veto_days: 2      # Skip stocks reporting results within 2 days
  min_swing_tech_score: 55.0 # Minimum score for swing consideration
  leader_tech_score: 70.0   # Setup 2 leader threshold

long_term:
  min_roce_5yr_avg: 15.0    # 5-year average ROCE >= 15%
  min_roce_single_year: 10.0 # No single year ROCE < 10%
  min_sales_growth_3yr: 10.0 # 3-year CAGR sales growth >= 10%
  min_profit_growth_3yr: 10.0 # 3-year CAGR PAT growth >= 10%
  max_debt_to_equity: 0.5   # D/E <= 0.5 (Debt-free or low debt)
  min_cfo_to_pat: 0.70      # Operating cash flow >= 70% of PAT
  allocation_parts: 3       # Tranche buy over 3 months

ai:
  enabled: true
  provider: "gemini"
  model: "gemini-2.5-flash"
  monthly_budget_usd: 5.0
  max_nightly_tokens: 4000
