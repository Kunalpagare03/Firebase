<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPro Intelligence Terminal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        :root { --primary-bg: #0b0f19; --card-bg: #151c2c; --accent: #38bdf8; --bull: #22c55e; --bear: #ef4444; --text: #f8fafc; --text-dim: #94a3b8; --border: #2d3748; }
        body { background-color: var(--primary-bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; }
        .navbar { background: var(--card-bg); border-bottom: 1px solid var(--border); }
        .nav-pills .nav-link { color: var(--text-dim); font-weight: 600; border-radius: 8px; margin-right: 8px; }
        .nav-pills .nav-link.active { background: rgba(56, 189, 248, 0.1); color: var(--accent); border: 1px solid var(--accent); }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 1rem; }
        .sector-badge { background: #2d3748; color: var(--accent); font-size: 0.7rem; font-weight: 800; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; }
        .rating-badge { font-size: 1.2rem; font-weight: 900; color: var(--bull); }
        .data-label { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; }
        .data-val { font-size: 0.9rem; font-weight: 700; }
        .news-item { border-left: 3px solid var(--border); padding-left: 10px; margin-bottom: 15px; }
        .news-impact-positive { color: var(--bull); }
        .news-impact-negative { color: var(--bear); }
        #dashboard-container { display: none; }
        .tab-content { padding-top: 10px; }
    </style>
</head>
<body>

<div id="login-container" class="container mt-5">
    <div class="card p-4 mx-auto" style="max-width: 400px;">
        <h2 class="text-center mb-4"><i class="bi bi-cpu text-info"></i> STOCKPRO</h2>
        <input type="email" id="email" class="form-control bg-dark text-white border-secondary mb-3" placeholder="Email">
        <input type="password" id="password" class="form-control bg-dark text-white border-secondary mb-4" placeholder="Access Key">
        <button id="login-btn" class="btn btn-info w-100 fw-bold text-white">LOGIN</button>
        <p id="login-error" class="text-danger mt-3 small text-center" style="display:none;"></p>
    </div>
</div>

<div id="dashboard-container">
    <nav class="navbar navbar-dark px-3 py-2 sticky-top">
        <span class="navbar-brand fw-bold small text-info"><i class="bi bi-shield-check"></i> PRO TERMINAL v5</span>
        <button id="logout-btn" class="btn btn-link text-muted p-0"><i class="bi bi-power"></i></button>
    </nav>

    <div class="container-fluid p-3">
        <ul class="nav nav-pills mb-4 scroll-nav" style="overflow-x: auto; white-space: nowrap; flex-wrap: nowrap;">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#options-tab">OPTIONS</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#intraday-tab">INTRADAY</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#swing-tab">SWING</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#news-tab">NEWS</button></li>
        </ul>

        <div class="tab-content">
            <!-- OPTIONS -->
            <div class="tab-pane fade show active" id="options-tab">
                <select id="symbol-select" class="form-select bg-dark text-white border-secondary mb-3">
                    <option value="NIFTY">NIFTY 50</option>
                    <option value="BANKNIFTY">BANKNIFTY</option>
                </select>
                <div id="option-content"></div>
            </div>

            <!-- INTRADAY -->
            <div class="tab-pane fade" id="intraday-tab">
                <div id="intraday-list"></div>
            </div>

            <!-- SWING -->
            <div class="tab-pane fade" id="swing-tab">
                <div id="swing-list"></div>
            </div>

            <!-- NEWS -->
            <div class="tab-pane fade" id="news-tab">
                <div id="news-list"></div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDMEUmFGSJBjGrz7fpDN46OiZlSJ6NTsjE",
        authDomain: "kunal-analysis.firebaseapp.com",
        projectId: "kunal-analysis",
        storageBucket: "kunal-analysis.firebasestorage.app",
        messagingSenderId: "328297105533",
        appId: "1:328297105533:web:3ed3d8d5aa3ec677b88914"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    document.getElementById('login-btn').onclick = async () => {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        try { await signInWithEmailAndPassword(auth, e, p); } catch(err) { document.getElementById('login-error').innerText = "Invalid Access Key"; document.getElementById('login-error').style.display='block'; }
    };
    document.getElementById('logout-btn').onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
        if (user) { document.getElementById('login-container').style.display = 'none'; document.getElementById('dashboard-container').style.display = 'block'; startApp(); }
        else { document.getElementById('login-container').style.display = 'block'; document.getElementById('dashboard-container').style.display = 'none'; }
    });

    function renderStockCard(s) {
        return `
            <div class="card p-3">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <span class="sector-badge mb-1">${s.sector}</span>
                        <h4 class="mb-0 fw-bold">${s.symbol.replace('.NS','')}</h4>
                    </div>
                    <div class="text-end">
                        <div class="rating-badge">${s.rating}</div>
                        <div class="small text-${s.change > 0 ? 'success':'danger'} fw-bold">${s.change}%</div>
                    </div>
                </div>
                <div class="mt-2 small fw-bold text-info">${s.recommendation}</div>
                <div class="row mt-3 g-2 text-center border-top border-secondary pt-2">
                    <div class="col"><div class="data-label">Price</div><div class="data-val">${s.price}</div></div>
                    <div class="col"><div class="data-label">Vol Ratio</div><div class="data-val">${s.vol_ratio}x</div></div>
                    <div class="col"><div class="data-label">EMA 200</div><div class="data-val">${s.ema200}</div></div>
                </div>
            </div>`;
    }

    function startApp() {
        // Comprehensive Stock Data
        onSnapshot(doc(db, "stock_scans", "comprehensive"), (snap) => {
            const data = snap.data();
            if (!data) return;

            // Render Intraday Grouped by Sector
            const intraCont = document.getElementById('intraday-list');
            intraCont.innerHTML = '<h5 class="text-info mb-3">Intraday (Buy/Sell Today)</h5>';
            const intraBySector = {};
            (data.intraday || []).forEach(s => { if(!intraBySector[s.sector]) intraBySector[s.sector] = []; intraBySector[s.sector].push(s); });
            Object.keys(intraBySector).forEach(sector => {
                intraCont.innerHTML += `<div class="section-header small text-muted mt-3 mb-2">${sector}</div>`;
                intraBySector[sector].forEach(s => intraCont.innerHTML += renderStockCard(s));
            });

            // Render Swing Grouped by Sector
            const swingCont = document.getElementById('swing-list');
            swingCont.innerHTML = '<h5 class="text-info mb-3">Swing (Buy Next Day)</h5>';
            const swingBySector = {};
            (data.swing || []).forEach(s => { if(!swingBySector[s.sector]) swingBySector[s.sector] = []; swingBySector[s.sector].push(s); });
            Object.keys(swingBySector).forEach(sector => {
                swingCont.innerHTML += `<div class="section-header small text-muted mt-3 mb-2">${sector}</div>`;
                swingBySector[sector].forEach(s => swingCont.innerHTML += renderStockCard(s));
            });

            // Render News
            const newsCont = document.getElementById('news-list');
            newsCont.innerHTML = '';
            (data.market_news || []).forEach(n => {
                newsCont.innerHTML += `
                    <div class="news-item">
                        <div class="small text-dim mb-1">${n.time} | Impact: <span class="news-impact-${n.impact.toLowerCase()}">${n.impact}</span></div>
                        <a href="${n.link}" target="_blank" class="text-white text-decoration-none fw-bold small">${n.headline}</a>
                    </div>`;
            });
        });

        // Options Data (Previously implemented logic)
        setupOptionListener("NIFTY");
        document.getElementById('symbol-select').onchange = (e) => setupOptionListener(e.target.value);
    }

    function setupOptionListener(symbol) {
        onSnapshot(doc(db, "option_sentiment", symbol), (snap) => {
            const d = snap.data();
            if (!d) return;
            // (Re-render logic for options tab - simplified here but included in full)
            document.getElementById('option-content').innerHTML = `
                <div class="card p-3 bg-dark text-white text-center">
                    <h2 class="mb-0 fw-bold text-${d.final_signal === 'Bullish' ? 'success' : 'danger'}">${d.combined_sentiment_read}</h2>
                    <div class="small text-muted mt-1">Spot: ${d.spot_price} | Max Pain: ${d.max_pain}</div>
                </div>
                <div id="main-chart" style="height:250px;"></div>
                <div class="card p-3 mt-3 small">
                    <div class="d-flex justify-content-between mb-2"><span>PCR (OI): ${d.pcr_oi}</span><span>PCR (Vol): ${d.pcr_volume}</span></div>
                    <div class="text-dim border-top pt-2">Structure: <span class="text-info">${d.price_structure?.trend || 'Range'}</span></div>
                </div>`;
            renderChart(d.spot_history || []);
        });
    }

    function renderChart(hist) {
        if (!hist.length) return;
        Plotly.newPlot('main-chart', [{ x: hist.map(h => new Date(h.time)), y: hist.map(h => h.value), type: 'scatter', mode: 'lines', line: { color: '#38bdf8', width: 2 } }], {
            paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
            margin: { t: 5, r: 15, b: 30, l: 35 },
            xaxis: { showgrid: false, tickfont: { color: '#94a3b8', size: 9 } },
            yaxis: { gridcolor: '#334155', tickfont: { color: '#94a3b8', size: 9 } }
        }, { responsive: true, displayModeBar: false });
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
