<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StockPro | Terminal v69.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        :root { --bg-main: #e8eef0; --bg-card: #ffffff; --accent: #153f4c; --bull: #1d8f5a; --bear: #b32727; --border: #c5d3d5; --txt-main: #17212b; --txt-dim: #587078; }
        body { background: radial-gradient(circle at 15% 0%,#d9f1eb 0,#e8eef0 38%,#f5efe4 100%); color: var(--txt-main); font-family: Georgia, 'Times New Roman', serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        .navbar { background: rgba(255,255,255,0.9); border-bottom: 1px solid var(--border); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000; }
        .navbar-brand { color: var(--accent) !important; font-weight: 800; font-size: 1.5rem; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; display: flex; border-top: 1px solid var(--border); z-index: 1000; height: 65px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--txt-dim); font-size: 0.7rem; font-weight: 700; border: none; background: none; outline: none; cursor: pointer; }
        .nav-item.active { color: var(--accent); background: #f1f6f4; }
        .nav-item i { font-size: 1.3rem; margin-bottom: 2px; }
        #main-scroll { padding: 15px; padding-bottom: 85px; max-width: 1200px; margin: 0 auto; }
        .meta-text { font-size: 0.72rem; color: var(--txt-dim); line-height: 1.6; margin-bottom: 15px; background: rgba(255,255,255,0.4); padding: 8px; border-radius: 6px; }
        .card-custom { border: 1px solid var(--border); padding: 18px; border-radius: 6px; margin-bottom: 14px; background: rgba(255,255,255,0.88); box-shadow: 0 8px 24px rgba(31,57,64,.08); }
        .card-title { font-size: 1.15rem; font-weight: 700; color: #285466; margin-bottom: 12px; display: block; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .sig-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border: 1px solid #83aab0; border-radius: 8px; background: #153f4c; color: #fff; margin: 10px 0 14px; font-weight: 800; font-size: 1.2rem; }
        .sig-badge { padding: 9px 15px; border-radius: 5px; background: #69777b; color: #fff; min-width: 140px; text-align: center; text-transform: uppercase; }
        .bg-bull { background: var(--bull); }
        .bg-bear { background: var(--bear); }
        #tradeAction { display: inline-block; padding: 6px 10px; border-radius: 4px; font-weight: 800; font-size: 1rem; margin-bottom: 8px; }
        .alert-bullish { background: #d9f2e5; color: #12613b; }
        .alert-bearish { background: #f9dede; color: #8f2020; }
        .alert-wait { background: #f4ead0; color: #755519; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 10px; }
        .m-box { padding: 10px 12px; background: #f1f6f4; border-left: 4px solid #64a99b; border-radius: 4px; border: 1px solid var(--border); border-left-width: 4px; }
        .m-lbl { font-size: 0.85rem; font-weight: 800; color: #123b4a; margin-right: 5px; }
        .m-val { font-size: 0.95rem; font-weight: 700; color: var(--txt-main); }
        .spot-hl { color: #2563eb !important; font-family: monospace; font-size: 1.15rem; font-weight: 900; }
        .analysis-block { font-size: 0.85rem; line-height: 1.8; color: var(--txt-main); }
        .analysis-row { margin-bottom: 2px; border-bottom: 1px solid #f5f5f5; padding: 2px 0; }
        .analysis-row strong { color: var(--accent); min-width: 110px; display: inline-block; }
        .chart-box { background: #fbfcfd; border: 1px solid #c9d9d9; border-radius: 5px; margin-bottom: 1rem; height: 380px; width: 100%; }
        .tf-ctrls { display: flex; gap: 6px; margin-bottom: 8px; }
        .tf-btn { border: 1px solid #b9c9cd; background: #fff; color: #31525d; border-radius: 4px; padding: 6px 11px; font-size: .88rem; cursor: pointer; }
        .tf-btn.active { background: #153f4c; color: #fff; border-color: #153f4c; }
        .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); margin-top: 10px; }
        .table-pro { width: 100%; font-size: 0.85rem; border-collapse: collapse; background: #fff; }
        .table-pro th { background: #f8fbfc; padding: 12px; color: var(--txt-dim); border-bottom: 1px solid var(--border); text-align: left; }
        .table-pro td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; font-weight: 600; }
        .stk-btn { width: 100%; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 12px; text-align: left; border-left: 6px solid transparent; }
        .price-strip { display: flex; justify-content: space-around; margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; }
        .price-item { font-size: 0.75rem; color: var(--txt-dim); font-weight: 800; text-align: center; }
        .price-item span { display: block; font-size: 1rem; font-weight: 900; color: var(--accent); }
        #detail-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-main); z-index: 2000; padding: 20px; overflow-y: auto; }
        .back-btn { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 4px; font-weight: 800; margin-bottom: 20px; cursor: pointer; }
        .dot { height: 7px; width: 7px; background: #10b981; border-radius: 50%; display: inline-block; margin-right: 4px; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        #login-overlay { max-width: 450px; margin: 100px auto; padding: 25px; }
    </style>
</head>
<body>

<div id="login-overlay" style="display:none">
    <div class="card p-4 text-center shadow-lg">
        <h2 class="fw-bold mb-4" style="color:var(--accent)">STOCKPRO TERMINAL</h2>
        <input type="email" id="email" class="form-control mb-3" placeholder="Email">
        <input type="password" id="password" class="form-control mb-4" placeholder="Access Key">
        <button id="login-btn" class="btn btn-dark w-100 fw-bold py-2">LOGIN</button>
        <div id="login-error" class="text-danger small mt-2"></div>
    </div>
</div>

<div id="app-shell" style="display:none">
    <nav class="navbar navbar-light sticky-top px-3 py-2"><span class="navbar-brand">Live Option Chain Market Analysis</span><button id="logout-btn" class="btn btn-sm btn-outline-secondary"><i class="bi bi-power"></i></button></nav>
    <div id="main-scroll"></div>
    <div class="bottom-nav">
        <button class="nav-item active" onclick="setView('options')"><i class="bi bi-graph-up"></i>OPTIONS</button>
        <button class="nav-item" onclick="setView('intra')"><i class="bi bi-lightning-charge"></i>INTRA</button>
        <button class="nav-item" onclick="setView('swing')"><i class="bi bi-calendar-event"></i>SWING</button>
        <button class="nav-item" onclick="setView('pos')"><i class="bi bi-shield-check"></i>POS</button>
        <button class="nav-item" onclick="setView('admin')"><i class="bi bi-gear-fill"></i>SCAN</button>
    </div>
</div>

<div id="detail-view">
    <button class="back-btn" onclick="document.getElementById('detail-view').style.display='none'"><i class="bi bi-arrow-left"></i> BACK</button>
    <div id="detail-body"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const config = { apiKey: "AIzaSyDMEUmFGSJBjGrz7fpDN46OiZlSJ6NTsjE", authDomain: "kunal-analysis.firebaseapp.com", projectId: "kunal-analysis", storageBucket: "kunal-analysis.firebasestorage.app", appId: "1:328297105533:web:3ed3d8d5aa3ec677b88914" };
    const app = initializeApp(config); const auth = getAuth(app); const db = getFirestore(app);
    let view = 'options'; let symbol = 'NIFTY'; let tf = 5;
    let activeHistory = 'comprehensive'; // latest, history_1, history_2
    let master = { opt: {}, stocks: { comprehensive: {}, history_1: {}, history_2: {} }, live: { NIFTY: '-', BANKNIFTY: '-' } };
    let unsub = { opt: null, stocks: [] };

    const STORAGE_KEY = 'stockpro_gh_token';
    const getToken = () => localStorage.getItem(STORAGE_KEY) || "";

    setPersistence(auth, browserLocalPersistence);
    onAuthStateChanged(auth, (user) => {
        document.getElementById('login-overlay').style.display = user ? 'none' : 'block';
        document.getElementById('app-shell').style.display = user ? 'block' : 'none';
        if(user) start();
    });

    document.getElementById('login-btn').onclick = async () => {
        const e = document.getElementById('email').value.trim(), p = document.getElementById('password').value;
        try { await signInWithEmailAndPassword(auth, e, p); } catch(err) { document.getElementById('login-error').innerText = err.message; }
    };
    document.getElementById('logout-btn').onclick = () => signOut(auth);

    async function fetchSpot() {
        try {
            const symCode = symbol === 'NIFTY' ? '%5ENSEI' : '%5ENSEBANK';
            const r = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${symCode}?interval=1m&range=1d`);
            const j = await r.json();
            const p = j.chart.result[0].indicators.quote[0].close.filter(x => x).pop();
            master.live[symbol] = p.toFixed(2);
            const el = document.getElementById('live-spot-val'); if(el) el.innerText = master.live[symbol];
        } catch(e) {}
    }
    // High-speed price refresh: 1 second
    setInterval(fetchSpot, 1000);

    window.setView = (v) => { view = v; document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase().includes(v.slice(0,3)))); render(); };
    window.switchSym = (s) => { symbol = s; master.opt[symbol] = null; render(); fetchSpot(); startOpt(); };
    window.switchHistory = (h) => { activeHistory = h; render(); };
    window.setTF = (m) => { tf = m; render(); };

    window.triggerCloudSync = async () => {
        const t = document.getElementById('gh_token').value.trim(); if(!t) { alert("GitHub Token Required!"); return; }
        localStorage.setItem(STORAGE_KEY, t);
        try {
            const r = await fetch('https://api.github.com/repos/Kunalpagare03/Firebase/dispatches', { method: 'POST', headers: { 'Authorization': `Bearer ${t}`, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, body: JSON.stringify({ event_type: 'manual_scan' }) });
            if(r.ok || r.status === 204) alert("SUCCESS! Full market scan (2,800+ stocks) and history rotation started.");
            else alert("Error " + r.status);
        } catch(e) { alert("Failed: " + e.message); }
    };

    function start() {
        startOpt(); fetchSpot();
        // Subscribe to Latest, History 1 and History 2 for Stocks
        ['comprehensive', 'history_1', 'history_2'].forEach(docId => {
            onSnapshot(doc(db, "stock_scans", docId), (snap) => {
                const d = snap.data(); if (!d) return;
                master.stocks[docId] = { "intra": d.intraday || [], "swing": d.swing || [], "pos": d.positional || [], "ts": d.timestamp };
                if(view !== 'options' && view !== 'admin') render();
            });
        });
        onSnapshot(doc(db, "stock_scans", "status"), (snap) => {
            const d = snap.data(); if (d) { master.scanner_status = d; if(view === 'admin') render(); }
        });
    }
    function startOpt() {
        if(unsub.opt) unsub.opt();
        unsub.opt = onSnapshot(doc(db, "option_sentiment", symbol), (snap) => { const d = snap.data(); if (d) { master.opt[symbol] = d; if(view === 'options') render(); } });
    }

    function render() {
        const container = document.getElementById('main-scroll'); if (!container) return;
        if (view === 'admin') {
            const s = master.scanner_status || { status: 'Idle', last_scan_time: '--:--' };
            container.innerHTML = `<div class="card-custom"><h4>Cloud Control</h4><p class="small muted">Trigger full scan of 2,800+ stocks and rotate the last 3 results.</p><input type="password" id="gh_token" class="form-control bg-dark text-white mb-3" value="${getToken()}"><button class="btn btn-success w-100 fw-bold py-3" onclick="triggerCloudSync()">RUN FULL CLOUD SYNC</button><div class="mt-3 small text-center">Status: ${s.status}<br>Last Sync: ${s.last_scan_time}</div></div>`;
            return;
        }
        if (view === 'options') {
            const d = master.opt[symbol]; if (!d) { container.innerHTML = '<div class="text-center py-5">Syncing Option Chain...</div>'; return; }
            const liveSpot = master.live[symbol] !== '-' ? master.live[symbol] : d.spot_price;
            const sig = d.final_signal || 'Neutral'; const alert = d.trade_alert || {}; const tech = alert.technicals || {}; const p = d.price_action || {}; const g = d.greeks || {};
            let oi = ''; (d.top_strikes || []).forEach(r => { oi += `<tr><td>${r.strike}</td><td>${r.call_oi}</td><td>${r.put_oi}</td><td>${r.total_oi}</td><td>${r.call_buildup||'-'}</td><td>${r.put_buildup||'-'}</td><td>${(r.oi_side||'N/A').split(' ')[0]}</td></tr>`; });

            container.innerHTML = `
                <div class="meta-text">Chain: nse-fallback | Spot: Live | <span class="dot"></span> LIVE TICK [${symbol}] | Sync: ${d.fetched_at}<br>Market status: OPEN | market open | ${d.fetched_at}</div>
                <div class="mb-3 d-flex align-items-center gap-2"><span class="fw-bold">Instrument</span><select class="form-select flex-fill" onchange="switchSym(this.value)"><option value="NIFTY" ${symbol==='NIFTY'?'selected':''}>NIFTY 50</option><option value="BANKNIFTY" ${symbol==='BANKNIFTY'?'selected':''}>BANKNIFTY</option></select></div>

                <div class="sig-header"><span>Directional signal</span><span class="sig-badge ${sig==='Bullish'?'bg-bull':'bg-bear'}">${sig}</span></div>

                <div class="card-custom"><strong>Action alert:</strong> <span id="tradeAction" class="${alert.action?.includes('CALL')?'alert-bullish':(alert.action?.includes('PUT')?'alert-bearish':'alert-wait')}">${alert.action || 'WAIT'}</span><br><span class="muted small">Trigger: ${alert.trigger || 'Wait for break'}</span><br><span class="muted small">Confirmations: ${alert.note || ''}</span><div class="muted small mt-1">RSI: ${tech.rsi || '-'} | MACD: ${tech.macd || '-'} | Trend: ${tech.trendline || '-'} | Candle: ${tech.candle || '-'}</div></div>

                <div class="metrics-grid">
                    <div class="m-box"><span class="m-lbl">Spot:</span><span class="m-val spot-hl" id="live-spot-val">${liveSpot}</span></div>
                    <div class="m-box"><span class="m-lbl">Max pain:</span><span class="m-val">${d.max_pain}</span></div>
                    <div class="m-box"><span class="m-lbl">PCR (OI):</span><span class="m-val">${d.pcr_oi}</span></div>
                    <div class="m-box"><span class="m-lbl">PCR (vol):</span><span class="m-val">${d.pcr_volume || '0.0'}</span></div>
                    <div class="m-box"><span class="m-lbl">Final signal:</span><span class="m-val">${sig}</span></div>
                </div>

                <div class="card-custom analysis-block">
                    <div class="analysis-row"><strong>Market read:</strong> <span>${d.combined_sentiment_read}</span></div>
                    <div class="analysis-row"><strong>Chart structure:</strong> <span>${d.price_structure?.pattern || 'Range'}</span></div>
                    <div class="analysis-row"><strong>Detected Pattern:</strong> <span class="text-info fw-bold" style="background:rgba(56, 189, 248, 0.1); padding:2px 6px; border-radius:4px;">${d.price_structure?.chart_pattern || 'Analyzing...'}</span></div>
                    <div class="analysis-row"><strong>Support:</strong> <span>${(d.support_zones||[]).join(', ')}</span> <strong>Resistance:</strong> <span>${(d.resistance_zones||[]).join(', ')}</span></div>
                    <div class="analysis-row"><strong>OI buildup:</strong> <span>${d.oi_buildup_overall || 'Neutral'}</span></div>
                    <div class="analysis-row"><strong>OI trend:</strong> <span>${d.oi_trend || 'N/A'}</span></div>
                    <div class="analysis-row"><strong>OI directional read:</strong> <span>${d.oi_directional_read || ''}</span></div>
                    <div class="analysis-row"><strong>Flow:</strong> <span>${d.vol_flow || 'Neutral'}</span></div>
                    <div class="analysis-row"><strong>Volume deltas:</strong> <span>${d.vol_deltas || ''}</span> | <strong>OI deltas:</strong> <span>${d.oi_deltas || ''}</span></div>
                    <div class="analysis-row"><strong>Manipulation risk:</strong> <span>${d.manipulation_risk || 'Low'}</span></div>
                    <div class="analysis-row"><strong>Manipulation note:</strong> <span>${d.manipulation_note || ''}</span></div>
                    <div class="analysis-row"><strong>Trend using price + OI buildup:</strong> <span>${d.decision_note || '-'}</span></div>
                    <div class="countdown" style="color:#b32727; font-weight:800; margin-top:5px;">Next trend analysis active.</div>
                </div>

                <div class="card-custom"><span class="card-title">Price Action</span><div class="metrics-grid"><div class="m-box"><span class="m-lbl">Close:</span><span class="m-val">${p.close||'-'}</span></div><div class="m-box"><span class="m-lbl">Daily change:</span><span class="m-val">${p.change||'0'} (${p.change_pct||'0'}%)</span></div><div class="m-box"><span class="m-lbl">20-SMA:</span><span class="m-val">${p.sma20||'--'}</span></div><div class="m-box"><span class="m-lbl">Read:</span><span class="m-val small">${p.reading||'Mixed'}</span></div><div class="m-box"><span class="m-lbl">Intraday read:</span><span class="m-val small">${p.intraday_read || 'Mixed'}</span></div></div></div>
                <div class="card-custom"><span class="card-title">ATM Greeks</span><div class="metrics-grid"><div class="m-box"><span class="m-lbl">Strike:</span><span class="m-val">${g.strike||'--'}</span></div><div class="m-box"><span class="m-lbl">Call delta:</span><span class="m-val">${g.call_delta||'0'}</span></div><div class="m-box"><span class="m-lbl">Put delta:</span><span class="m-val">${g.put_delta||'0'}</span></div><div class="m-box"><span class="m-lbl">Gamma:</span><span class="m-val">${g.gamma||'0'}</span></div><div class="m-box"><span class="m-lbl">Vega / 1%:</span><span class="m-val">${g.vega_per_1pct||'0'}</span></div><div class="m-box"><span class="m-lbl">Trend:</span><span class="m-val small">${g.trend||'--'}</span></div><div class="m-box"><span class="m-lbl">Read:</span><span class="m-val small">${g.reading||'--'}</span></div></div></div>

                <div class="card-custom"><span class="card-title">Live 5-minute candlestick chart</span><div class="tf-ctrls"><button class="tf-btn ${tf===5?'active':''}" onclick="setTF(5)">5m</button><button class="tf-btn ${tf===15?'active':''}" onclick="setTF(15)">15m</button><button class="tf-btn ${tf===30?'active':''}" onclick="setTF(30)">30m</button><button class="tf-btn ${tf===60?'active':''}" onclick="setTF(60)">1h</button></div><div id="chart" class="chart-box"></div></div>
                <div class="card-custom"><span class="card-title">Top strikes by total OI</span><div class="table-wrap"><table class="table-pro"><thead><tr><th>Strike</th><th>Call OI</th><th>Put OI</th><th>Total OI</th><th>Call OI build</th><th>Put OI build</th><th>OI side</th></tr></thead><tbody>${oi}</tbody></table></div></div>
            `;
            if((d.spot_history || []).length > 1) {
                requestAnimationFrame(() => {
                    const candles = buildCandles(d.spot_history, tf);
                    if(candles.length > 0) {
                        const trace = { x: candles.map(c=>c.x), open: candles.map(c=>c.open), high: candles.map(c=>c.high), low: candles.map(c=>c.low), close: candles.map(c=>c.close), type: 'candlestick', increasing: {line: {color: '#1f9d61'}}, decreasing: {line: {color: '#d9485f'}} };
                        const shapes = [];
                        (d.resistance_zones || []).forEach(val => { shapes.push({ type: 'line', xref: 'paper', x0: 0, x1: 1, y0: val, y1: val, line: { color: 'rgba(179, 39, 39, 0.4)', width: 1, dash: 'dash' } }); });
                        (d.support_zones || []).forEach(val => { shapes.push({ type: 'line', xref: 'paper', x0: 0, x1: 1, y0: val, y1: val, line: { color: 'rgba(29, 143, 90, 0.4)', width: 1, dash: 'dash' } }); });
                        Plotly.react('chart', [trace], { paper_bgcolor:'rgba(0,0,0,0)', plot_bgcolor:'rgba(0,0,0,0)', margin:{t:10,r:10,b:30,l:40}, xaxis:{showgrid:false, tickfont:{size:8}, rangeslider:{visible:false}}, yaxis:{gridcolor:'#eee', tickfont:{size:8}}, shapes: shapes }, {responsive:true, displayModeBar:false});
                    }
                });
            }
        } else {
            const data = master.stocks[activeHistory] || {};
            const list = data[view] || [];
            let historyHtml = `<div class="mb-3"><select class="form-select form-select-sm" onchange="switchHistory(this.value)"><option value="comprehensive" ${activeHistory==='comprehensive'?'selected':''}>Latest Scan (${master.stocks.comprehensive?.ts || '--:--'})</option><option value="history_1" ${activeHistory==='history_1'?'selected':''}>Previous Scan 1 (${master.stocks.history_1?.ts || '--:--'})</option><option value="history_2" ${activeHistory==='history_2'?'selected':''}>Previous Scan 2 (${master.stocks.history_2?.ts || '--:--'})</option></select></div>`;
            if (!list.length) { container.innerHTML = historyHtml + '<div class="text-center py-5">No trades found.</div>'; return; }
            let h = historyHtml;
            const sectors = {}; list.forEach(s => { if(!sectors[s.sector]) sectors[s.sector] = []; sectors[s.sector].push(s); });
            Object.keys(sectors).sort().forEach(sec => {
                h += `<div class="fw-bold mb-2 small text-uppercase" style="color:var(--accent); border-bottom:1px solid var(--border)">${sec}</div>`;
                sectors[sec].forEach(s => { h += `<button class="stk-btn" onclick="openDetails('${s.symbol}', '${activeHistory}', '${view}')"><div class="d-flex justify-content-between align-items-center"><div><div class="fw-bold">${s.symbol.replace('.NS','')}</div><div class="small muted">${s.rating} Score</div></div><div class="text-end"><div class="fw-bold text-${s.change > 0 ? 'success':'danger'}">${s.change}%</div><div class="small muted">${s.price}</div></div></div><div class="price-strip"><div class="price-item">TGT<span>${s.target_price}</span></div><div class="price-item">SL<span>${s.sl_price}</span></div></div></button>`; });
            });
            container.innerHTML = h;
        }
    }
    function buildCandles(history, intervalMin) {
        const intervalMs = intervalMin * 60 * 1000; const bins = {};
        history.forEach(tick => { const bucket = Math.floor(tick.time / intervalMs) * intervalMs; if (!bins[bucket]) bins[bucket] = []; bins[bucket].push(tick.value); });
        return Object.keys(bins).sort().map(time => { const v = bins[time]; return { x: new Date(parseInt(time)), open: v[0], high: Math.max(...v), low: Math.min(...v), close: v[v.length-1] }; });
    }
    window.openDetails = (s_id, historyId, type) => {
        const s = master.stocks[historyId][type].find(x => x.symbol === s_id); if (!s) return;
        document.getElementById('detail-body').innerHTML = `<div class="sig-header"><span>${s.symbol.replace('.NS','')}</span><span class="sig-badge ${s.change > 0 ? 'bg-bull':'bg-bear'}">${s.recommendation}</span></div><div class="metrics-grid"><div class="m-box"><span class="m-lbl">Price</span><span class="m-val">${s.price}</span></div><div class="m-box"><span class="m-lbl">Target</span><span class="m-val text-success">${s.target_price}</span></div><div class="m-box"><span class="m-lbl">SL</span><span class="m-val text-danger">${s.sl_price}</span></div></div><div class="card-custom small">${s.justification || ''}</div>`;
        document.getElementById('detail-view').style.display = 'block';
    };
</script>
