<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPro | Institutional Terminal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        :root {
            --primary-bg: #0b0f19;
            --card-bg: #151c2c;
            --accent: #38bdf8;
            --bull-green: #22c55e;
            --bear-red: #ef4444;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: #2d3748;
        }
        body { background-color: var(--primary-bg); color: var(--text-main); font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .navbar { background-color: var(--card-bg) !important; border-bottom: 1px solid var(--border); }
        .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 1rem; color: var(--text-main); }
        .nav-pills .nav-link { color: var(--text-dim); border-radius: 8px; font-weight: 600; margin-right: 5px; border: 1px solid transparent; }
        .nav-pills .nav-link.active { background-color: rgba(56, 189, 248, 0.1); color: var(--accent); border: 1px solid var(--accent); }

        .signal-banner { padding: 1rem; border-radius: 12px; margin-bottom: 1rem; text-align: center; font-weight: 800; font-size: 1.2rem; text-transform: uppercase; }
        .signal-bullish { background: linear-gradient(135deg, #064e3b 0%, #065f46 100%); border: 1px solid var(--bull-green); color: #4ade80; }
        .signal-bearish { background: linear-gradient(135deg, #450a0a 0%, #7f1d1d 100%); border: 1px solid var(--bear-red); color: #f87171; }

        .alert-panel { background: #0c4a6e; border-left: 4px solid var(--accent-blue); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
        .section-header { font-size: 0.8rem; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.75rem; display: flex; align-items: center; }
        .section-header i { margin-right: 8px; }

        .data-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; margin-bottom: 1rem; }
        .data-box { background: rgba(15, 23, 42, 0.5); padding: 0.5rem; border-radius: 8px; border: 1px solid var(--border); text-align: center; }
        .data-label { font-size: 0.65rem; color: var(--text-dim); display: block; margin-bottom: 2px; text-transform: uppercase; }
        .data-val { font-size: 0.9rem; font-weight: 700; color: var(--text-main); }

        .justification-box { background: rgba(56, 189, 248, 0.05); border-left: 3px solid var(--accent); padding: 10px; margin-top: 10px; font-size: 0.8rem; border-radius: 0 4px 4px 0; }
        .news-impact-positive { color: var(--bull-green); }
        .news-impact-negative { color: var(--bear-red); }

        .chart-box { height: 250px; background: rgba(0, 0, 0, 0.2); border-radius: 8px; margin-bottom: 1rem; }
        .table-custom { font-size: 0.75rem; color: var(--text-main); }
        .table-custom th { color: var(--text-dim); font-weight: 600; border-bottom: 1px solid var(--border); }

        #login-container { max-width: 400px; margin-top: 100px; }
        #dashboard-container { display: none; }
        .tab-pane { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="login-container" class="container">
    <div class="card p-4 text-center">
        <h2 class="fw-bold mb-4"><i class="bi bi-cpu text-info"></i> STOCKPRO</h2>
        <input type="email" id="email" class="form-control bg-dark text-white border-secondary mb-3" placeholder="Email">
        <input type="password" id="password" class="form-control bg-dark text-white border-secondary mb-4" placeholder="Password">
        <button id="login-btn" class="btn btn-info w-100 fw-bold">AUTHENTICATE</button>
        <p id="login-error" class="text-danger mt-3 small" style="display:none;"></p>
    </div>
</div>

<div id="dashboard-container">
    <nav class="navbar navbar-dark px-3 py-2 sticky-top">
        <span class="navbar-brand fw-bold small"><i class="bi bi-lightning-charge-fill text-warning"></i> TERMINAL v4.1</span>
        <button id="logout-btn" class="btn btn-link text-muted p-0"><i class="bi bi-power"></i></button>
    </nav>

    <div class="container-fluid p-3">
        <ul class="nav nav-pills mb-3" id="main-tabs">
            <li class="nav-item flex-fill"><button class="nav-link active w-100" data-bs-toggle="pill" data-bs-target="#options-tab">OPTIONS</button></li>
            <li class="nav-item flex-fill"><button class="nav-link w-100" data-bs-toggle="pill" data-bs-target="#intraday-tab">INTRADAY</button></li>
            <li class="nav-item flex-fill"><button class="nav-link w-100" data-bs-toggle="pill" data-bs-target="#news-tab">NEWS</button></li>
        </ul>

        <div class="tab-content">
            <!-- OPTIONS TAB -->
            <div class="tab-pane fade show active" id="options-tab">
                <select id="symbol-select" class="form-select bg-dark text-white border-secondary mb-3">
                    <option value="NIFTY">NIFTY 50 INDEX</option>
                    <option value="BANKNIFTY">BANKNIFTY INDEX</option>
                    <option value="FINNIFTY">FINNIFTY INDEX</option>
                    <option value="SENSEX">SENSEX INDEX</option>
                </select>
                <div id="option-content">
                    <div class="text-center py-5 text-dim"><div class="spinner-border text-info"></div><br>Syncing Real-Time Feed...</div>
                </div>
            </div>

            <!-- INTRADAY TAB -->
            <div class="tab-pane fade" id="intraday-tab">
                <div class="section-header"><i class="bi bi-lightning-fill"></i>Momentum Breakouts</div>
                <div id="intraday-list"></div>
            </div>

            <!-- NEWS TAB -->
            <div class="tab-pane fade" id="news-tab">
                <div class="section-header"><i class="bi bi-newspaper"></i>Market Headlines</div>
                <div id="news-list"></div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDMEUmFGSJBjGrz7fpDN46OiZlSJ6NTsjE",
        authDomain: "kunal-analysis.firebaseapp.com",
        projectId: "kunal-analysis",
        storageBucket: "kunal-analysis.firebasestorage.app",
        messagingSenderId: "328297105533",
        appId: "1:328297105533:web:3ed3d8d5aa3ec677b88914",
        measurementId: "G-91D760DWX5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let optSub = null;

    document.getElementById('login-btn').onclick = async () => {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        try { await signInWithEmailAndPassword(auth, e, p); } catch(err) { document.getElementById('login-error').innerText = "Auth Failed"; document.getElementById('login-error').style.display='block'; }
    };
    document.getElementById('logout-btn').onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('dashboard-container').style.display = 'block';
            startApp();
        } else {
            document.getElementById('login-container').style.display = 'block';
            document.getElementById('dashboard-container').style.display = 'none';
        }
    });

    function startApp() {
        // Intraday & News Listener
        onSnapshot(doc(db, "stock_scans", "intraday"), (snap) => {
            const data = snap.data();
            if (!data) return;

            // Render Stocks
            const stockCont = document.getElementById('intraday-list');
            stockCont.innerHTML = '';
            (data.results || []).forEach(s => {
                stockCont.innerHTML += `
                    <div class="card p-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span class="fw-bold fs-5">${s.symbol}</span>
                            <span class="text-${s.change > 0 ? 'success':'danger'} fw-bold">${s.change > 0 ? '+':''}${s.change}%</span>
                        </div>
                        <div class="small text-dim mb-2">${s.strategy} | VOL ${s.volume_ratio}x</div>
                        <div class="justification-box"><strong>WHY:</strong> ${s.justification}</div>
                        <div class="row mt-3 text-center small border-top border-secondary pt-2">
                            <div class="col"><span class="data-label">Price</span><div class="data-val">${s.price}</div></div>
                            <div class="col"><span class="data-label">Target</span><div class="data-val text-success">${s.target}</div></div>
                            <div class="col"><span class="data-label">Stop</span><div class="data-val text-danger">${s.stop}</div></div>
                        </div>
                    </div>`;
            });

            // Render News
            const newsCont = document.getElementById('news-list');
            newsCont.innerHTML = '';
            (data.market_news || []).forEach(n => {
                newsCont.innerHTML += `
                    <div class="card p-3">
                        <div class="small text-dim mb-1">${n.time} | Impact: <span class="news-impact-${n.impact.toLowerCase()}">${n.impact}</span></div>
                        <a href="${n.link}" target="_blank" class="text-white text-decoration-none fw-bold small">${n.headline}</a>
                    </div>`;
            });
        });

        // Initial Option Load
        setupOptSub("NIFTY");
        document.getElementById('symbol-select').onchange = (e) => setupOptSub(e.target.value);
    }

    function setupOptSub(symbol) {
        if (optSub) optSub();
        optSub = onSnapshot(doc(db, "option_sentiment", symbol), (snap) => {
            const d = snap.data();
            if (!d) {
                document.getElementById('option-content').innerHTML = '<div class="text-center py-5 text-dim">No Live Feed for ' + symbol + '</div>';
                return;
            }
            renderOptions(symbol, d);
        });
    }

    function renderOptions(symbol, d) {
        const t = d.trade_alert || {};
        const g = d.greeks || {};
        const pa = d.price_action || {};
        const isBull = d.final_signal === 'Bullish';

        let oiRows = '';
        (d.top_strikes || []).forEach(r => {
            oiRows += `<tr><td>${r.strike}</td><td>${r.call_oi}</td><td>${r.put_oi}</td><td>${r.total_oi}</td><td class="${r.oi_side.includes('Call') ? 'text-danger':'text-success'}">${r.oi_side}</td></tr>`;
        });

        document.getElementById('option-content').innerHTML = `
            <div class="signal-banner ${isBull ? 'signal-bullish' : 'signal-bearish'}">
                ${d.final_signal || 'NEUTRAL'}
            </div>

            <div class="alert-panel p-3">
                <div class="section-header"><i class="bi bi-lightning-fill"></i>ACTION PROTOCOL</div>
                <div class="fw-bold">${t.action || 'HOLD'}</div>
                <div class="small text-white-50 mt-1">${t.trigger || 'N/A'}</div>
            </div>

            <div class="section-header"><i class="bi bi-graph-up"></i>LIVE SPOT TICK</div>
            <div id="main-chart" class="chart-box"></div>

            <div class="data-grid mt-3">
                <div class="data-box"><span class="data-label">Spot Price</span><span class="data-val">${d.spot_price}</span></div>
                <div class="data-box"><span class="data-label">Max Pain</span><span class="data-val">${d.max_pain}</span></div>
                <div class="data-box"><span class="data-label">PCR (OI)</span><span class="data-val">${d.pcr_oi}</span></div>
                <div class="data-box"><span class="data-label">Intraday</span><span class="data-val small">${d.intraday_price_read || 'MIXED'}</span></div>
            </div>

            <div class="section-header"><i class="bi bi-shield-check"></i>TECHNICAL TELEMETRY</div>
            <div class="card p-3 small mb-3">
                <div class="mb-1"><span class="text-dim">Structure:</span> <span class="text-info fw-bold">${d.price_structure?.trend || 'Range'}</span></div>
                <div class="mb-1"><span class="text-dim">Candle:</span> ${t.technical?.candle || 'N/A'}</div>
                <div class="mb-1"><span class="text-dim">Support:</span> ${(d.support_zones || []).join(' | ')}</div>
                <div class="mb-0"><span class="text-dim">Resistance:</span> ${(d.resistance_zones || []).join(' | ')}</div>
            </div>

            <div class="section-header"><i class="bi bi-percent"></i>ATM GREEKS</div>
            <div class="data-grid">
                <div class="data-box"><span class="data-label">Call Delta</span><span class="data-val">${g.call_delta || 'N/A'}</span></div>
                <div class="data-box"><span class="data-label">Put Delta</span><span class="data-val">${g.put_delta || 'N/A'}</span></div>
                <div class="data-box"><span class="data-label">Gamma</span><span class="data-val">${g.gamma || 'N/A'}</span></div>
                <div class="data-box"><span class="data-label">Vega</span><span class="data-val">${g.vega || 'N/A'}</span></div>
            </div>

            <div class="section-header mt-3"><i class="bi bi-bar-chart-fill"></i>OI CONCENTRATION</div>
            <div class="table-responsive">
                <table class="table table-custom text-center">
                    <thead><tr><th>Strike</th><th>Call OI</th><th>Put OI</th><th>Total</th><th>Side</th></tr></thead>
                    <tbody>${oiRows}</tbody>
                </table>
            </div>

            <div class="text-center text-dim small mt-4 mb-5">Terminal Sync: ${d.fetched_at || '--:--'}</div>
        `;
        drawChart(d.spot_history || []);
    }

    function drawChart(hist) {
        if (!hist.length) return;
        const x = hist.map(h => new Date(h.time));
        const y = hist.map(h => h.value);
        Plotly.newPlot('main-chart', [{
            x, y, type: 'scatter', mode: 'lines',
            line: { color: '#38bdf8', width: 2, shape: 'spline' },
            fill: 'tozeroy', fillcolor: 'rgba(56, 189, 248, 0.1)'
        }], {
            paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
            margin: { t: 5, r: 15, b: 30, l: 35 },
            xaxis: { showgrid: false, tickfont: { color: '#94a3b8', size: 9 }, tickformat: '%H:%M' },
            yaxis: { gridcolor: '#334155', tickfont: { color: '#94a3b8', size: 9 } }
        }, { responsive: true, displayModeBar: false });
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
