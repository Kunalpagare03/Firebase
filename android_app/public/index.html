<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StockPro | Terminal v65.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        :root { --bg-main: #e8eef0; --bg-card: #ffffff; --accent: #153f4c; --bull: #1d8f5a; --bear: #b32727; --border: #c5d3d5; --txt-main: #17212b; --txt-dim: #587078; }
        body { background: radial-gradient(circle at 15% 0%,#d9f1eb 0,#e8eef0 38%,#f5efe4 100%); color: var(--txt-main); font-family: Georgia, 'Times New Roman', serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        .navbar { background: rgba(255,255,255,0.9); border-bottom: 1px solid var(--border); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000; }
        .navbar-brand { color: var(--accent) !important; font-weight: 800; font-size: 1.5rem; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; display: flex; border-top: 1px solid var(--border); z-index: 1000; height: 65px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--txt-dim); font-size: 0.7rem; font-weight: 700; border: none; background: none; outline: none; cursor: pointer; }
        .nav-item.active { color: var(--accent); background: #f1f6f4; }
        .nav-item i { font-size: 1.3rem; margin-bottom: 2px; }
        #main-scroll { padding: 15px; padding-bottom: 85px; max-width: 1200px; margin: 0 auto; }
        .card-custom { border: 1px solid var(--border); padding: 18px; border-radius: 6px; margin-bottom: 14px; background: rgba(255,255,255,0.88); box-shadow: 0 8px 24px rgba(31,57,64,.08); }
        .sig-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border: 1px solid #83aab0; border-radius: 8px; background: #153f4c; color: #fff; margin: 10px 0 14px; font-weight: 800; font-size: 1.2rem; }
        .sig-badge { padding: 9px 15px; border-radius: 5px; background: #69777b; color: #fff; min-width: 140px; text-align: center; text-transform: uppercase; }
        .bg-bull { background: var(--bull); }
        .bg-bear { background: var(--bear); }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 10px; }
        .m-box { padding: 10px 12px; background: #f1f6f4; border-left: 4px solid #64a99b; border-radius: 4px; border: 1px solid var(--border); border-left-width: 4px; }
        .m-lbl { font-size: 0.85rem; font-weight: 800; color: #123b4a; margin-right: 5px; }
        .m-val { font-size: 0.95rem; font-weight: 700; color: var(--txt-main); }
        .spot-hl { color: #2563eb !important; font-family: monospace; font-size: 1.15rem; font-weight: 900; }
        .chart-box { background: #fbfcfd; border: 1px solid #c9d9d9; border-radius: 5px; margin-bottom: 1rem; height: 380px; width: 100%; }
        .stk-btn { width: 100%; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 12px; text-align: left; border-left: 6px solid transparent; }
        .price-strip { display: flex; justify-content: space-around; margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; }
        .price-item { font-size: 0.75rem; color: var(--txt-dim); font-weight: 800; text-align: center; }
        .price-item span { display: block; font-size: 1rem; font-weight: 900; color: var(--accent); }
        #detail-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-main); z-index: 2000; padding: 20px; overflow-y: auto; }
        .back-btn { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 4px; font-weight: 800; margin-bottom: 20px; cursor: pointer; }
        .run-ctrls { display: flex; gap: 10px; margin-top: 10px; }
        .run-btn { flex: 1; padding: 10px; font-weight: 800; border-radius: 6px; border: none; background: var(--accent); color: #fff; font-size: 0.8rem; }
    </style>
</head>
<body>

<div id="login-overlay" style="display:none">
    <div class="card p-4 text-center shadow-lg" style="max-width:400px; margin:100px auto;">
        <h2 class="fw-bold mb-4" style="color:var(--accent)">STOCKPRO HUB</h2>
        <input type="email" id="email" class="form-control mb-3" placeholder="Email">
        <input type="password" id="password" class="form-control mb-4" placeholder="Terminal Key">
        <button id="login-btn" class="btn btn-dark w-100 fw-bold py-2">LOGIN</button>
        <div id="login-error" class="text-danger small mt-2"></div>
    </div>
</div>

<div id="app-shell" style="display:none">
    <nav class="navbar navbar-light sticky-top px-3 py-2"><span class="navbar-brand">Professional Trading Hub</span><button id="logout-btn" class="btn btn-sm btn-outline-secondary"><i class="bi bi-power"></i></button></nav>
    <div id="main-scroll"></div>
    <div class="bottom-nav">
        <button class="nav-item active" onclick="setView('options')"><i class="bi bi-graph-up"></i>OPTIONS</button>
        <button class="nav-item" onclick="setView('intra')"><i class="bi bi-lightning-charge"></i>INTRA</button>
        <button class="nav-item" onclick="setView('swing')"><i class="bi bi-calendar-event"></i>SWING</button>
        <button class="nav-item" onclick="setView('pos')"><i class="bi bi-shield-check"></i>POS</button>
        <button class="nav-item" onclick="setView('admin')"><i class="bi bi-gear-fill"></i>SCAN</button>
    </div>
</div>

<div id="detail-view">
    <button class="back-btn" onclick="document.getElementById('detail-view').style.display='none'"><i class="bi bi-arrow-left"></i> BACK</button>
    <div id="detail-body"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const config = { apiKey: "AIzaSyDMEUmFGSJBjGrz7fpDN46OiZlSJ6NTsjE", authDomain: "kunal-analysis.firebaseapp.com", projectId: "kunal-analysis", storageBucket: "kunal-analysis.firebasestorage.app", appId: "1:328297105533:web:3ed3d8d5aa3ec677b88914" };
    const app = initializeApp(config); const auth = getAuth(app); const db = getFirestore(app);
    let currentView = 'options'; let currentSymbol = 'NIFTY';
    let masterData = { opt: {}, stocks: {}, live: { NIFTY: '-', BANKNIFTY: '-' } };
    let unsubscribes = { opt: null, stocks: null, status: null };

    const STORAGE_KEY = 'stockpro_gh_token';
    const getToken = () => localStorage.getItem(STORAGE_KEY) || "";

    setPersistence(auth, browserLocalPersistence);
    onAuthStateChanged(auth, (user) => {
        document.getElementById('login-overlay').style.display = user ? 'none' : 'block';
        document.getElementById('app-shell').style.display = user ? 'block' : 'none';
        if(user) start();
    });

    document.getElementById('login-btn').onclick = async () => {
        const e = document.getElementById('email').value.trim(), p = document.getElementById('password').value;
        try { await signInWithEmailAndPassword(auth, e, p); } catch(err) { document.getElementById('login-error').innerText = err.message; }
    };
    document.getElementById('logout-btn').onclick = () => signOut(auth);

    async function fetchSpot() {
        try {
            const sym = currentSymbol === 'NIFTY' ? '%5ENSEI' : '%5ENSEBANK';
            const r = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1m&range=1d`);
            const j = await r.json();
            const p = j.chart.result[0].indicators.quote[0].close.filter(x => x).pop();
            masterData.live[currentSymbol] = p.toFixed(2);
            const el = document.getElementById('live-spot-val'); if(el) el.innerText = masterData.live[currentSymbol];
        } catch(e) {}
    }
    setInterval(fetchSpot, 2000);

    window.setView = (v) => {
        currentView = v;
        document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase().includes(v.slice(0,3))));
        renderUI();
    };

    window.switchSym = (s) => { currentSymbol = s; masterData.opt[currentSymbol] = null; renderUI(); fetchSpot(); startOpt(); };

    window.triggerManual = async () => {
        const t = getToken();
        if(!t) { setView('admin'); alert("GitHub Token Required in SCAN tab!"); return; }
        try {
            const r = await fetch('https://api.github.com/repos/Kunalpagare03/Firebase/dispatches', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${t}`, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
                body: JSON.stringify({ event_type: 'manual_scan' })
            });
            if(r.ok || r.status === 204) alert("SUCCESS! Cloud Terminal triggered."); else alert("GitHub Error: " + r.status);
        } catch(e) { alert("Failed: " + e.message); }
    };

    function start() {
        startOpt(); fetchSpot();
        onSnapshot(doc(db, "stock_scans", "comprehensive"), (snap) => {
            const d = snap.data(); if (!d) return;
            masterData.stocks = { "intra": d.intraday || [], "swing": d.swing || [], "pos": d.positional || [] };
            masterData.stocks_ts = d.timestamp; if(currentView !== 'options' && currentView !== 'admin') renderUI();
        });
        onSnapshot(doc(db, "stock_scans", "status"), (snap) => {
            const d = snap.data(); if (d) { masterData.scanner_status = d; if(currentView === 'admin') renderUI(); }
        });
    }

    function startOpt() {
        if(unsubscribes.opt) unsubscribes.opt();
        unsubscribes.opt = onSnapshot(doc(db, "option_sentiment", currentSymbol), (snap) => {
            const d = snap.data(); if (d) { masterData.opt[currentSymbol] = d; if(currentView === 'options') renderUI(); }
        });
    }

    function renderUI() {
        const container = document.getElementById('main-scroll'); if (!container) return;

        if (currentView === 'admin') {
            const s = masterData.scanner_status || { status: 'Idle', last_scan_time: '--:--' };
            container.innerHTML = `
                <div class="card-custom">
                    <div class="fw-bold mb-3">GitHub Cloud Sync Settings</div>
                    <input type="password" id="gh_token_input" class="form-control bg-dark text-white mb-3" placeholder="Enter Token" value="${getToken()}">
                    <button class="btn btn-primary w-100 fw-bold mb-3" onclick="localStorage.setItem('${STORAGE_KEY}', document.getElementById('gh_token_input').value); alert('Saved!');">SAVE TOKEN</button>
                    <button class="btn btn-success w-100 fw-bold py-3" onclick="triggerManual()">RUN FULL CLOUD SYNC</button>
                    <div class="mt-3 text-center small muted">Status: ${s.status}<br>Last: ${s.last_scan_time}</div>
                </div>`;
            return;
        }

        if (currentView === 'options') {
            const d = masterData.opt[currentSymbol]; if (!d) { container.innerHTML = '<div class="text-center py-5">Syncing Option Chain...</div>'; return; }
            const sig = d.final_signal || 'Neutral'; const tech = d.trade_alert?.technicals || {};
            let oi = ''; (d.top_strikes || []).forEach(r => { oi += `<tr><td>${r.strike}</td><td>${r.call_oi}</td><td>${r.put_oi}</td><td>${(r.oi_side||'').split(' ')[0]}</td></tr>`; });

            container.innerHTML = `
                <div class="card-custom">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <strong>Instrument</strong>
                        <select class="form-select w-50" onchange="switchSym(this.value)"><option value="NIFTY">NIFTY</option><option value="BANKNIFTY" ${currentSymbol==='BANKNIFTY'?'selected':''}>BANKNIFTY</option></select>
                    </div>
                    <div class="run-ctrls"><button class="run-btn" onclick="triggerManual()">RUN STOCK</button><button class="run-btn" onclick="triggerManual()">RUN OPTION</button></div>
                </div>
                <div class="sig-header"><span>Signal</span><span class="sig-badge ${sig==='Bullish'?'bg-bull':'bg-bear'}">${sig}</span></div>
                <div class="metrics-grid">
                    <div class="m-box"><span class="m-lbl">Spot:</span><span class="m-val spot-hl" id="live-spot-val">${masterData.live[currentSymbol]}</span></div>
                    <div class="m-box"><span class="m-lbl">PCR:</span><span class="m-val">${d.pcr_oi}</span></div>
                    <div class="m-box"><span class="m-lbl">RSI:</span><span class="m-val">${tech.rsi||'-'}</span></div>
                </div>
                <div class="card-custom small">${d.combined_sentiment_read}<br>Pattern: <strong>${d.price_structure?.chart_pattern||'-'}</strong></div>
                <div id="chart" class="chart-box"></div>
                <div class="table-wrap"><table class="table-pro"><thead><tr><th>Strike</th><th>C-OI</th><th>P-OI</th><th>Side</th></tr></thead><tbody>${oi}</tbody></table></div>
            `;
            if((d.spot_history || []).length > 1) {
                requestAnimationFrame(() => {
                    Plotly.react('chart', [{ x: d.spot_history.map(h=>new Date(h.time)), y: d.spot_history.map(h=>h.value), type:'scatter', mode:'lines', line:{color:'#153f4c', width:3}, fill:'tozeroy' }], { paper_bgcolor:'rgba(0,0,0,0)', plot_bgcolor:'rgba(0,0,0,0)', margin:{t:10,r:10,b:30,l:40}, xaxis:{showgrid:false, tickfont:{size:8}}, yaxis:{gridcolor:'#eee', tickfont:{size:8}} }, {responsive:true, displayModeBar:false});
                });
            }
        } else {
            const list = masterData.stocks[currentView] || [];
            if (!list.length) {
                container.innerHTML = `<div class="text-center py-5">
                    <h5>No ${currentView.toUpperCase()} setups found.</h5>
                    <p class="small muted">The market may be too volatile for safe entries right now.</p>
                    <button class="btn btn-sm btn-dark" onclick="triggerManual()">RE-SCAN NOW</button>
                </div>`;
                return;
            }
            let h = `<div class="small muted mb-3 text-center">Cloud Sync: ${masterData.stocks_ts}</div>`;
            const sectors = {}; list.forEach(s => { if(!sectors[s.sector]) sectors[s.sector] = []; sectors[s.sector].push(s); });
            Object.keys(sectors).sort().forEach(sec => {
                h += `<div class="fw-bold mb-2 small text-uppercase" style="border-bottom:1px solid var(--border)">${sec}</div>`;
                sectors[sec].forEach(s => {
                    h += `<button class="stk-btn" onclick="openDetails('${s.symbol}', '${currentView}')">
                        <div class="d-flex justify-content-between align-items-center">
                            <div><div class="fw-bold">${s.symbol.replace('.NS','')}</div><div class="small muted">${s.rating} Score</div></div>
                            <div class="text-end"><div class="fw-bold ${s.change > 0 ? 'text-success':'text-danger'}">${s.change}%</div><div class="small muted">${s.price}</div></div>
                        </div>
                        <div class="price-strip"><div class="price-item">TGT<span>${s.target_price}</span></div><div class="price-item">SL<span>${s.sl_price}</span></div></div>
                    </button>`;
                });
            });
            container.innerHTML = h;
        }
    }
    window.openDetails = (s_id, type) => {
        const s = masterData.stocks[type].find(x => x.symbol === s_id); if (!s) return;
        document.getElementById('detail-body').innerHTML = `<div class="sig-header"><span>${s.symbol.replace('.NS','')}</span><span class="sig-badge ${s.change > 0 ? 'bg-bull':'bg-bear'}">${s.recommendation}</span></div><div class="metrics-grid"><div class="m-box"><span class="m-lbl">Price</span><span class="m-val">${s.price}</span></div><div class="m-box"><span class="m-lbl">Target</span><span class="m-val text-success">${s.target_price}</span></div><div class="m-box"><span class="m-lbl">SL</span><span class="m-val text-danger">${s.sl_price}</span></div></div><div class="card-custom small">${s.justification}</div>`;
        document.getElementById('detail-view').style.display = 'block';
    };
</script>
</body>
</html>
