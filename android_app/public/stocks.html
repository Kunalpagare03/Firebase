<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StockPro | Stock Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bg-main: #e8eef0; --bg-card: #ffffff; --accent: #153f4c; --bull: #1d8f5a; --bear: #b32727; --border: #c5d3d5; --txt-main: #17212b; --txt-dim: #587078; }
        body { background: radial-gradient(circle at 15% 0%,#d9f1eb 0,#e8eef0 38%,#f5efe4 100%); color: var(--txt-main); font-family: Georgia, 'Times New Roman', serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        .navbar { background: rgba(255,255,255,0.9); border-bottom: 1px solid var(--border); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000; padding: 10px 15px; }
        .navbar-brand { color: var(--accent) !important; font-weight: 800; font-size: 1.3rem; }
        .hub-btn { background: var(--accent); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 0.75rem; text-decoration: none; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; display: flex; border-top: 1px solid var(--border); z-index: 1000; height: 65px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--txt-dim); font-size: 0.65rem; font-weight: 700; border: none; background: none; outline: none; cursor: pointer; text-decoration: none; }
        .nav-item.active { color: var(--accent); background: #f1f6f4; }
        .nav-item i { font-size: 1.2rem; margin-bottom: 2px; }
        #main-scroll { padding: 15px; padding-bottom: 85px; max-width: 1200px; margin: 0 auto; }
        .card-custom { border: 1px solid var(--border); padding: 18px; border-radius: 6px; margin-bottom: 14px; background: rgba(255,255,255,0.88); box-shadow: 0 8px 24px rgba(31,57,64,.08); }
        .stk-btn { width: 100%; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 12px; text-align: left; transition: transform 0.1s; cursor: pointer; border-left: 6px solid #153f4c; }
        .stk-btn:active { transform: scale(0.98); }
        .price-strip { display: flex; justify-content: space-around; margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; }
        .price-item { font-size: 0.75rem; color: var(--txt-dim); font-weight: 800; text-align: center; }
        .price-item span { display: block; font-size: 1rem; font-weight: 900; color: var(--accent); }

        #detail-view { display: none; position: fixed; inset: 0; background: var(--bg-main); z-index: 2000; padding: 20px; overflow-y: auto; }
        .back-btn { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 4px; font-weight: 800; margin-bottom: 20px; cursor: pointer; }
        .sig-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border: 1px solid #83aab0; border-radius: 8px; background: #153f4c; color: #fff; margin: 10px 0 14px; font-weight: 800; font-size: 1.2rem; }
        .sig-badge { padding: 9px 15px; border-radius: 5px; color: #fff; min-width: 120px; text-align: center; text-transform: uppercase; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 10px; }
        .m-box { padding: 10px 12px; background: #f1f6f4; border-radius: 4px; border: 1px solid var(--border); }
        .m-lbl { font-size: 0.75rem; font-weight: 800; color: #123b4a; margin-right: 5px; }
        .m-val { font-size: 0.85rem; font-weight: 700; color: var(--txt-main); }
    </style>
</head>
<body>
<div id="app-shell">
    <nav class="navbar d-flex justify-content-between align-items-center">
        <span class="navbar-brand">Institutional Stock Hub</span>
        <a href="index.html" class="hub-btn">OPTION MIRROR</a>
    </nav>
    <div id="main-scroll"></div>
    <div class="bottom-nav">
        <button class="nav-item active" id="btn-intra" onclick="setView('intraday')"><i class="bi bi-lightning-charge"></i>INTRA</button>
        <button class="nav-item" id="btn-swing" onclick="setView('swing')"><i class="bi bi-calendar-event"></i>SWING</button>
        <button class="nav-item" id="btn-pos" onclick="setView('positional')"><i class="bi bi-shield-check"></i>POS</button>
        <button class="nav-item" id="btn-hist" onclick="setView('history')"><i class="bi bi-clock-history"></i>HISTORY</button>
        <a href="index.html?view=admin" class="nav-item"><i class="bi bi-gear-fill"></i>SCAN</a>
    </div>
</div>

<div id="detail-view">
    <button class="back-btn" onclick="document.getElementById('detail-view').style.display='none'"><i class="bi bi-arrow-left"></i> BACK TO HUB</button>
    <div id="detail-body"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const config = { apiKey: "AIzaSyDMEUmFGSJBjGrz7fpDN46OiZlSJ6NTsjE", authDomain: "kunal-analysis.firebaseapp.com", projectId: "kunal-analysis", storageBucket: "kunal-analysis.firebasestorage.app", appId: "1:328297105533:web:3ed3d8d5aa3ec677b88914" };
    const app = initializeApp(config); const auth = getAuth(app); const db = getFirestore(app);
    let view = 'intraday'; let master = { stocks: {}, history_full: [] }; let activeHistoryId = 'comprehensive';

    onAuthStateChanged(auth, (user) => { if(!user) window.location.href = 'index.html'; else start(); });

    window.setView = (v) => {
        view = v;
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        const idMap = { 'intraday': 'btn-intra', 'swing': 'btn-swing', 'positional': 'btn-pos', 'history': 'btn-hist' };
        document.getElementById(idMap[v]).classList.add('active');
        render();
    };

    window.switchHistory = async (id) => {
        activeHistoryId = id;
        if(id !== 'comprehensive' && !master.stocks[id]) {
            const snap = await getDocs(query(collection(db, "stock_history")));
            const docData = snap.docs.find(d => d.id === id);
            if(docData) master.stocks[id] = docData.data();
        }
        render();
    };

    async function start() {
        onSnapshot(doc(db, "stock_scans", "comprehensive"), (snap) => { const d = snap.data(); if (d) { master.stocks['comprehensive'] = d; render(); } });
        const q = query(collection(db, "stock_history"), orderBy("timestamp", "desc"), limit(30));
        const snap = await getDocs(q);
        master.history_full = snap.docs.map(d => d.data());
        render();
    }

    window.openDetails = (symbol, historyId, type) => {
        let list = [];
        if(type === 'history') {
            master.history_full.forEach(h => {
                list = list.concat(h.intraday || [], h.swing || [], h.positional || []);
            });
        } else {
            list = master.stocks[historyId]?.[type] || [];
        }
        const s = list.find(x => x.symbol === symbol);
        if (!s) return;

        document.getElementById('detail-body').innerHTML = `
            <div class="sig-header"><span>${s.symbol.replace('.NS','')}</span><span class="sig-badge" style="background:${s.change > 0 ? 'var(--bull)':'var(--bear)'}">${s.recommendation || 'WATCH'}</span></div>
            <div class="metrics-grid">
                <div class="m-box"><span class="m-lbl">Price</span><span class="m-val">₹${s.price}</span></div>
                <div class="m-box"><span class="m-lbl">Target</span><span class="m-val text-success">₹${s.target_price}</span></div>
                <div class="m-box"><span class="m-lbl">StopLoss</span><span class="m-val text-danger">₹${s.sl_price}</span></div>
                <div class="m-box"><span class="m-lbl">Rating</span><span class="m-val">${s.rating}</span></div>
            </div>
            <div class="card-custom"><div class="fw-bold mb-2">Institutional Justification:</div><div class="small">${s.justification || 'Technical setup building for breakout.'}</div></div>
        `;
        document.getElementById('detail-view').style.display = 'block';
    };

    function render() {
        const container = document.getElementById('main-scroll'); if (!container) return;

        if(view === 'history') {
            container.innerHTML = `<div class="fw-bold mb-3 small text-uppercase text-muted" style="letter-spacing:1px; border-bottom:1px solid var(--border)">7-Day Institutional Archive</div>`;
            const uniqueStocks = {};
            master.history_full.forEach(scan => {
                const all = (scan.intraday || []).concat(scan.swing || [], scan.positional || []);
                all.forEach(s => {
                    if(!uniqueStocks[s.symbol]) {
                        uniqueStocks[s.symbol] = {...s, count: 1, last_seen: scan.timestamp};
                    } else {
                        uniqueStocks[s.symbol].count++;
                    }
                });
            });
            const list = Object.values(uniqueStocks).sort((a,b) => b.count - a.count);
            if(!list.length) { container.innerHTML += '<div class="text-center py-5 card-custom">History loading...</div>'; return; }
            list.forEach(s => {
                container.innerHTML += `
                <div class="stk-btn" onclick="openDetails('${s.symbol}', 'none', 'history')">
                    <div class="d-flex justify-content-between px-3 pt-3">
                        <div><div class="fw-bold">${s.symbol.replace('.NS','')} <span class="badge bg-info" style="font-size:0.6rem">${s.count} Scans</span></div><div class="small muted">Last Seen: ${s.last_seen.split(' ')[0]}</div></div>
                        <div class="text-end"><div class="fw-bold text-${s.change > 0 ? 'success':'danger'}">${s.change}%</div><div class="small muted">₹${s.price}</div></div>
                    </div>
                </div>`;
            });
            return;
        }

        const data = master.stocks[activeHistoryId] || {};
        const list = data[view] || [];
        let options = '<option value="comprehensive">Latest Scan</option>';
        master.history_full.forEach(h => { options += `<option value="${h.doc_id}" ${activeHistoryId===h.doc_id?'selected':''}>Scan: ${h.timestamp}</option>`; });

        let historyHtml = `<div class="mb-3"><select class="form-select form-select-sm fw-bold" onchange="switchHistory(this.value)">${options}</select></div>`;
        if (!list.length) { container.innerHTML = historyHtml + '<div class="text-center py-5 card-custom">No trades found in this category.</div>'; return; }

        let h = historyHtml;
        const sectors = {}; list.forEach(s => { if(!sectors[s.sector]) sectors[s.sector] = []; sectors[s.sector].push(s); });
        Object.keys(sectors).sort().forEach(sec => {
            h += `<div class="fw-bold mb-2 small text-uppercase text-muted" style="letter-spacing:1px;">${sec}</div>`;
            sectors[sec].forEach(s => {
                h += `
                <div class="stk-btn" onclick="openDetails('${s.symbol}', '${activeHistoryId}', '${view}')">
                    <div class="d-flex justify-content-between px-3 pt-3">
                        <div><div class="fw-bold d-flex align-items-center gap-2">${s.symbol.replace('.NS','')}${s.conviction==='High' ? '<span class="badge bg-warning text-dark" style="font-size:0.6rem">HIGH</span>' : ''}</div><div class="small muted">${s.rating} Score</div></div>
                        <div class="text-end"><div class="fw-bold text-${s.change > 0 ? 'success':'danger'}">${s.change}%</div><div class="small muted">₹${s.price}</div></div>
                    </div>
                    <div class="price-strip"><div class="price-item">TGT<span>${s.target_price}</span></div><div class="price-item">SL<span>${s.sl_price}</span></div></div>
                </div>`;
            });
        });
        container.innerHTML = h;
    }
</script>
</body>
</html>
