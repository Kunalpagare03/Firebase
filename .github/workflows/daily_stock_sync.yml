name: Daily Stock Analysis Sync

on:
  schedule:
    # Runs at 10:30 AM UTC (4:00 PM IST) Monday-Friday
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd stock_alert_bot/stock
          pip install -r requirements.txt

      - name: Create service-account.json
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > stock_alert_bot/service-account.json

      - name: Run Stock Scanner
        env:
          PYTHONPATH: ${{ github.workspace }}/stock_alert_bot/stock
        run: |
          cd stock_alert_bot/stock
          python stock_scanner.py
