name: Continuous Real-Time Cloud Hub

on:
  schedule:
    # Starts at 03:40 UTC (9:10 AM IST) Monday-Friday
    - cron: '40 3 * * 1-5'
  workflow_dispatch:
  repository_dispatch:
    types: [manual_scan]

jobs:
  real-time-hub:
    runs-on: ubuntu-latest
    # Run for the full market session (approx 6.5 hours)
    timeout-minutes: 400
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy firebase-admin requests openpyxl pyotp SmartApi-python

      - name: Create service-account.json
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > stock_alert_bot/service-account.json

      - name: Run Master Hub Engine (Continuous)
        env:
          PYTHONPATH: ${{ github.workspace }}/stock_alert_bot/Option:${{ github.workspace }}/stock_alert_bot/stock
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: |
          cd stock_alert_bot/Option
          # Start the continuous runner that updates your phone every few seconds
          python scripts/cloud_market_runner.py
